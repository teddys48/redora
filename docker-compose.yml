services:
  redora:
    image: ghcr.io/teddys48/redora:latest
    container_name: redora
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/redora.db
      - ENCRYPTION_KEY=super-secret-production-encryption-key-32bytes
      - LOG_LEVEL=info
    volumes:
      - redora-data:/data
    restart: unless-stopped

volumes:
  redora-data:
    driver: local

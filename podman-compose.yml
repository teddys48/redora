version: '3.8'

services:
  redora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redora
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/redora.db
      - ENCRYPTION_KEY=super-secret-production-encryption-key-32bytes
      - LOG_LEVEL=info
    volumes:
      - redora-data:/data:Z
    restart: unless-stopped

volumes:
  redora-data:
